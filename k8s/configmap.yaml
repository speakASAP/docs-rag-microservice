apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-rag-microservice-config
  namespace: statex-apps
  labels:
    app: docs-rag-microservice
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "docs-rag-microservice"
  DOMAIN: "docs-rag.alfares.cz"
  PORT: "3397"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  # Legacy HS256 service tokens are still accepted, read-only, while callers are
  # re-minted as auth-issued RS256 principals. Set to "false" to close the window
  # once ServiceAuthGuard stops logging "Legacy HS256 token accepted".
  # Plan: shared/../docs/superpowers/plans/2026-09-05-docs-rag-rs256-migration.md
  ALLOW_HS256_FALLBACK: "true"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  NOTIFICATION_SERVICE_URL: "http://notifications-microservice.statex-apps.svc.cluster.local:3368"
  AI_SERVICE_URL: "http://ai-microservice.statex-apps.svc.cluster.local:3380"
  MONITORING_SERVICE_URL: "http://monitoring-microservice.statex-apps.svc.cluster.local:3395"
  QDRANT_URL: "http://qdrant.statex-apps.svc.cluster.local:6333"
  QDRANT_COLLECTION: "ecosystem-docs"
  QDRANT_VECTOR_SIZE: "768"
  OLLAMA_URL: "http://192.168.88.53:11435"
  OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
  # Ollama serves embeddings from one model instance; raising this saturates
  # it and produces "fetch failed" storms rather than more throughput.
  OLLAMA_EMBED_CONCURRENCY: "2"
  OLLAMA_EMBED_TIMEOUT_MS: "60000"
  # Minimum top-result similarity for agent-context to return an answer.
  RAG_CONFIDENT_MATCH_SCORE: "0.74"
  DB_HOST: "db-server-postgres.statex-apps.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "docs_rag"
  DB_NAME: "docs_rag"
  GIT_SYNC_INTERVAL_HOURS: "6"
  SCHEDULED_INGESTION_ENABLED: "true"
  GIT_BASE_PATH: "/data/repos"
  DB_AUTO_CREATE: "false"
