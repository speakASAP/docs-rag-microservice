apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-rag-microservice
  namespace: statex-apps
  labels:
    app: docs-rag-microservice
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-rag-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: docs-rag-microservice
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      volumes:
        - name: git-repos
          hostPath:
            path: /home/ssf/Documents/Github
            type: Directory
      containers:
        - name: app
          image: localhost:5000/docs-rag-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3397
              name: http
          envFrom:
            - configMapRef:
                name: docs-rag-microservice-config
            - secretRef:
                name: docs-rag-microservice-secret
          startupProbe:
            httpGet:
              path: /health
              port: 3397
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3397
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3397
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: git-repos
              mountPath: /data/repos
              readOnly: true
