apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-rag-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: docs-rag-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/docs-rag-microservice
        property: DB_PASSWORD
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/docs-rag-microservice
        property: LOGGING_SERVICE_TOKEN
