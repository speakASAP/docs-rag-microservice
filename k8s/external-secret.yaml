apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-rag-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: docs-rag-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/docs-rag-microservice
        property: DB_PASSWORD
    # Per-pair RS256 ingest credential for docs-rag-microservice -> logging-microservice
    # (svc-docs-rag-microservice--logging-microservice@internal.alfares.cz,
    # role internal:logging-microservice:ingest). Replaces shared
    # logging-ingest-credentials (static non-JWT).
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/docs-rag-microservice
        property: LOGGING_SERVICE_TOKEN
